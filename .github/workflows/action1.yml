name: Security Pipeline

on:
  push:
    branches: [feature-1]
  pull_request:
    branches: [feature-1]

jobs:
  build:
    name: Build and package application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-target-jar
          path: target/*.jar

  sonarqube:
    name: Build and static code analysis using SonarQube
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Cache SonarQube packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=java-app -Dsonar.projectName='java-app'

  dependency-check:
    name: Dependency vulnerability check
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Download OWASP Dependency-Check
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v8.4.0/dependency-check-8.4.0-release.zip
          unzip dependency-check-8.4.0-release.zip

      - name: Run Dependency-Check
        run: |
          ./dependency-check/bin/dependency-check.sh --project "demo" --scan . --format "HTML" --out dependency-check-report.html

      - name: Upload Dependency-Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report.html

  container-security:
    name: Container security scan
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean install

      # - name: list files and foulders
      #   run: ls -la && ls target

      - name: Build Docker image
        run: docker build -t java-app:latest .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'java-app:latest'
          format: 'table'
          output: 'trivy-report.txt'

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  upload-reports-s3:
    runs-on: ubuntu-latest
    needs: [container-security]
    steps:
      - name: Download Trivy Report
        uses: actions/download-artifact@v4  # Corrected action
        with:
          name: trivy-report
          path: reports  # Ensure reports directory exists

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-session-token: ${{ secrets.TOKEN }}

      - name: Upload reports to S3
        run: |
          aws s3 cp reports/trivy-report.txt s3://${{ secrets.S3_BUCKET }}/trivy-report.txt

      # - name: Upload reports to S3
      #   run: |
      #     aws s3 cp reports/dependency-check-report.html s3://${{ secrets.S3_BUCKET }}/dependency-check-report.html
      #     aws s3 cp reports/trivy-report.txt s3://${{ secrets.S3_BUCKET }}/trivy-report.txt

